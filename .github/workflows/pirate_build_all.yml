name: Pirate CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pirate-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cli-linux:
    name: CLI (Linux x86_64)
    runs-on: ubuntu-latest
    env:
      HOST: x86_64-unknown-linux-gnu
      BUILD: x86_64-unknown-linux-gnu
    outputs:
      version: ${{ steps.pkgver.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Ensure parent depends alias
        shell: bash
        run: ln -sfn "$PWD/depends" "$PWD/../depends"
      - name: Set version suffix
        shell: bash
        run: |
          # Real releases (tag pushes) use configure.ac's version as-is.
          # Everything else (e.g. auto-release on master) appends a short
          # git sha so repeated builds off the same configure.ac version
          # don't collide.
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "APP_VERSION_SUFFIX=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            cmake \
            m4 \
            g++-multilib \
            autoconf \
            libtool \
            libncurses-dev \
            unzip \
            git \
            python3 \
            python3-zmq \
            zlib1g-dev \
            wget \
            libcurl4-gnutls-dev \
            bsdmainutils \
            curl \
            libsodium-dev \
            bison \
            liblz4-dev \
            zip
      - name: Build daemon
        run: |
          chmod +x zcutil/build.sh
          ./zcutil/build.sh -j$(nproc)
      - name: Determine package version
        id: pkgver
        shell: bash
        run: |
          BASE_VERSION="$(sed -n 's/^PACKAGE_VERSION *= *//p' Makefile | head -1)"
          if [ -n "${APP_VERSION_SUFFIX:-}" ]; then
            VERSION="${BASE_VERSION}-${APP_VERSION_SUFFIX}"
          else
            VERSION="$BASE_VERSION"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Same <arch>-<os> convention build-zip.sh already uses for QT
          # packages, so CLI and QT artifact names line up.
          echo "PLATFORM=${HOST%%-*}-linux" >> "$GITHUB_ENV"
      - name: Strip CLI (Linux)
        run: |
          strip --strip-unneeded src/pirated src/pirate-cli src/pirate-tx
      - name: Fetch Zcash params (tests)
        run: ./zcutil/fetch-params.sh
      - name: Run tests (Linux)
        env:
          PYTHONPATH: ./src/test
          SRCDIR: ./src
          BUILDDIR: ./src
        run: |
          export PATH="$PWD/src:$PATH"
          make check
          python3 src/test/bitcoin-util-test.py
          python3 src/test/wallet-utility.py
          test/functional/test_runner.py --jobs=$(nproc)
      - name: Package CLI (Linux)
        run: |
          mkdir -p dist
          zip -j "dist/pirate-cli-${PLATFORM}-v${VERSION}.zip" \
            src/pirated \
            src/pirate-cli \
            src/pirate-tx \
            PIRATE_7776
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cli-linux
          path: dist/*

  cli-windows:
    name: CLI (Windows x86_64 cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Ensure parent depends alias
