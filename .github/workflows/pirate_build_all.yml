            pkg-config \
            cmake \
            m4 \
            g++-multilib \
            autoconf \
            libtool \
            libncurses-dev \
            unzip \
            git \
            python3 \
            python3-zmq \
            zlib1g-dev \
            wget \
            libcurl4-gnutls-dev \
            bsdmainutils \
            curl \
            libsodium-dev \
            bison \
            liblz4-dev \
            zip \
            dpkg-dev \
            qtbase5-dev \
            qttools5-dev \
            qttools5-dev-tools
      - name: Build QT (Linux)
        run: |
          chmod +x zcutil/build-qt-linux.sh
          ./zcutil/build-qt-linux.sh -j$(nproc)
      - name: Package QT (Linux)
        run: |
          # build-qt-linux.sh already strips, versions (from configure.ac,
          # via the Makefile's PACKAGE_VERSION), and packages this into
          # artifacts/bin/pirate-qt-*.deb and artifacts/bin/pirate-qt-*.zip -
          # see zcutil/build-deb.sh, zcutil/build-zip.sh.
          mkdir -p dist
          cp artifacts/bin/pirate-qt-*.deb artifacts/bin/pirate-qt-*.zip dist/
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qt-linux
          path: dist/*

