          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Matches the HOST build-win.sh hardcodes internally. Same
          # <arch>-<os> convention build-zip.sh uses for QT packages.
          HOST=x86_64-w64-mingw32
          echo "PLATFORM=${HOST%%-*}-windows" >> "$GITHUB_ENV"
      - name: Strip CLI (Windows)
        run: |
          x86_64-w64-mingw32-strip --strip-unneeded \
            src/pirated.exe src/pirate-cli.exe src/pirate-tx.exe
      - name: Package CLI (Windows)
        run: |
          mkdir -p dist
          zip -j "dist/pirate-cli-${PLATFORM}-v${VERSION}.zip" \
            src/pirated.exe \
            src/pirate-cli.exe \
            src/pirate-tx.exe \
            PIRATE_7776
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cli-windows
          path: dist/*

