name: Pirate CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pirate-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86_64 (CLI + QT)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkgver.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Set version suffix
        shell: bash
        run: |
          # Real releases (tag pushes) use configure.ac's version as-is.
          # Everything else (e.g. auto-release on master) appends a short
          # git sha so repeated builds off the same configure.ac version
          # don't collide.
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "APP_VERSION_SUFFIX=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: Build, test, and package (Docker, ubuntu:20.04)
        run: |
          # Pins the build (and the test run, and the packaging - see the
          # Dockerfile) to a fixed ubuntu:20.04 glibc/toolchain baseline
          # instead of whatever ubuntu-latest happens to be this week, and
          # builds this exact checkout (not a fresh git clone of master,
          # unlike docker-engine-builds' standalone images). One build only
          # (build-qt-linux.sh) exports both the CLI zip and the QT deb/zip,
          # plus the resolved version string.
          mkdir -p docker-out
          docker build \
            --build-arg APP_VERSION_SUFFIX="${APP_VERSION_SUFFIX:-}" \
            --target=binaries \
            -o docker-out \
            -f zcutil/docker/ubuntu20.04-linux.Dockerfile \
            .
      - name: Determine package version
        id: pkgver
        shell: bash
        run: |
          VERSION="$(cat docker-out/VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: |
            docker-out/pirate-cli-*.zip
            docker-out/pirate-qt-*.deb
            docker-out/pirate-qt-*.zip

  windows-x86_64-cross:
    name: Windows x86_64 cross (CLI + QT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set version suffix
        shell: bash
        run: |
          # Real releases (tag pushes) use configure.ac's version as-is.
          # Everything else (e.g. auto-release on master) appends a short
          # git sha so repeated builds off the same configure.ac version
          # don't collide.
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "APP_VERSION_SUFFIX=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: Build and package (Docker, ubuntu:20.04)
        run: |
          # Pins the build (and the packaging - see the Dockerfile) to a
          # fixed ubuntu:20.04 glibc/toolchain baseline instead of whatever
          # ubuntu-latest happens to be this week, and builds this exact
          # checkout (not a fresh git clone of master, unlike
          # docker-engine-builds' standalone images). One build only
          # (build-qt-win.sh) exports both the CLI zip and the QT zip.
          mkdir -p docker-out
          docker build \
            --build-arg APP_VERSION_SUFFIX="${APP_VERSION_SUFFIX:-}" \
            --target=binaries \
            -o docker-out \
            -f zcutil/docker/ubuntu20.04-windows-cc.Dockerfile \
            .
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64-cross
          path: docker-out/pirate-*.zip

  linux-aarch64-cross:
    name: Linux AArch64 cross (CLI + QT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set version suffix
        shell: bash
        run: |
          # Real releases (tag pushes) use configure.ac's version as-is.
          # Everything else (e.g. auto-release on master) appends a short
          # git sha so repeated builds off the same configure.ac version
          # don't collide.
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "APP_VERSION_SUFFIX=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: Build and package (Docker, ubuntu:20.04)
        run: |
          # Pins the build (and the packaging - see the Dockerfile) to a
          # fixed ubuntu:20.04 glibc/toolchain baseline instead of whatever
          # ubuntu-latest happens to be this week, and builds this exact
          # checkout (not a fresh git clone of master, unlike
          # docker-engine-builds' standalone images). One build only
          # (build-qt-aarch64.sh) exports both the CLI zip and the QT
          # deb/zip.
          mkdir -p docker-out
          docker build \
            --build-arg APP_VERSION_SUFFIX="${APP_VERSION_SUFFIX:-}" \
            --target=binaries \
            -o docker-out \
            -f zcutil/docker/ubuntu20.04-aarch64-cc.Dockerfile \
            .
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-aarch64-cross
          path: |
            docker-out/pirate-cli-*.zip
            docker-out/pirate-qt-*.deb
            docker-out/pirate-qt-*.zip

  cli-macos:
    name: CLI (macOS arm64)
    # Earliest arm64 image GitHub still offers (macos-13 and older are
    # retired) - same reasoning as pinning the Linux jobs to ubuntu:20.04:
    # macos-latest is a rolling target that eventually moves to a newer
    # macOS release without warning.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - name: Ensure parent depends alias
        shell: bash
        run: ln -sfn "$PWD/depends" "$PWD/../depends"
      - name: Set version suffix
        shell: bash
        run: |
          # Real releases (tag pushes) use configure.ac's version as-is.
          # Everything else (e.g. auto-release on master) appends a short
          # git sha so repeated builds off the same configure.ac version
          # don't collide.
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "APP_VERSION_SUFFIX=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: Install Homebrew dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew untap aws/tap 2>/dev/null || true

          install_brew_formulae() {
            missing=()
            for formula in "$@"; do
              if ! brew list --formula "$formula" >/dev/null 2>&1; then
                missing+=("$formula")
              fi
            done
            if [ "${#missing[@]}" -gt 0 ]; then
              brew install "${missing[@]}"
            fi
          }

          install_brew_formulae autoconf automake libtool coreutils bison cmake
          command -v pkg-config >/dev/null 2>&1 || brew install pkgconf
          command -v python3 >/dev/null 2>&1 || brew install python
          command -v wget >/dev/null 2>&1 || brew install wget
          command -v curl >/dev/null 2>&1 || brew install curl
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build daemon (macOS)
        env:
          CONFIGURE_FLAGS: --disable-hardening
        run: |
          chmod +x zcutil/build-mac.sh
          ./zcutil/build-mac.sh --disable-tests -j$(sysctl -n hw.ncpu)
      - name: Determine package version
        shell: bash
        run: |
          BASE_VERSION="$(sed -n 's/^PACKAGE_VERSION *= *//p' Makefile | head -1)"
          if [ -n "${APP_VERSION_SUFFIX:-}" ]; then
            VERSION="${BASE_VERSION}-${APP_VERSION_SUFFIX}"
          else
            VERSION="$BASE_VERSION"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Same HOST detection build-mac.sh uses, so this matches whatever
          # arch tag build-zip.sh gives the QT package built on this runner.
          HOST="$(./depends/config.guess)"
          echo "PLATFORM=${HOST%%-*}-macos" >> "$GITHUB_ENV"
      - name: Strip CLI (macOS)
        run: |
          strip -x src/pirated src/pirate-cli src/pirate-tx
      - name: Package CLI (macOS)
        run: |
          mkdir -p dist
          zip -j "dist/pirate-cli-${PLATFORM}-v${VERSION}.zip" \
            src/pirated \
            src/pirate-cli \
            src/pirate-tx \
            PIRATE_7776
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cli-macos
          path: dist/*

  cli-macos-intel:
    name: CLI (macOS Intel x86_64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - name: Ensure parent depends alias
        shell: bash
        run: ln -sfn "$PWD/depends" "$PWD/../depends"
      - name: Set version suffix
        shell: bash
        run: |
          # Real releases (tag pushes) use configure.ac's version as-is.
          # Everything else (e.g. auto-release on master) appends a short
          # git sha so repeated builds off the same configure.ac version
          # don't collide.
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "APP_VERSION_SUFFIX=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: Install Homebrew dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew untap aws/tap 2>/dev/null || true

          install_brew_formulae() {
            missing=()
            for formula in "$@"; do
              if ! brew list --formula "$formula" >/dev/null 2>&1; then
                missing+=("$formula")
              fi
            done
            if [ "${#missing[@]}" -gt 0 ]; then
              brew install "${missing[@]}"
            fi
          }

          install_brew_formulae autoconf automake libtool coreutils bison cmake
          command -v pkg-config >/dev/null 2>&1 || brew install pkgconf
          command -v python3 >/dev/null 2>&1 || brew install python
          command -v wget >/dev/null 2>&1 || brew install wget
          command -v curl >/dev/null 2>&1 || brew install curl
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build daemon (macOS)
        env:
          CONFIGURE_FLAGS: --disable-hardening
        run: |
          chmod +x zcutil/build-mac.sh
          ./zcutil/build-mac.sh --disable-tests -j$(sysctl -n hw.ncpu)
