                missing+=("$formula")
              fi
            done
            if [ "${#missing[@]}" -gt 0 ]; then
              brew install "${missing[@]}"
            fi
          }

          install_brew_formulae autoconf automake libtool coreutils bison cmake qt@5 create-dmg
          command -v pkg-config >/dev/null 2>&1 || brew install pkgconf
          command -v python3 >/dev/null 2>&1 || brew install python
          command -v wget >/dev/null 2>&1 || brew install wget
          command -v curl >/dev/null 2>&1 || brew install curl
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build QT (macOS)
        run: |
          chmod +x zcutil/build-qt-mac.sh
          ./zcutil/build-qt-mac.sh -j$(sysctl -n hw.ncpu)
      - name: Package QT (macOS)
        run: |
          # build-qt-mac.sh (via makeReleaseMac.sh) already versions (from
          # configure.ac, via the Makefile's PACKAGE_VERSION) and moves the
          # .dmg into artifacts/bin/pirate-qt-*.dmg. It also produces
          # artifacts/bin/pirate-cli-*.zip as a side effect (build-zip.sh's
          # "cli" package - macOS has no separate CLI-only build script this
          # job could call instead), which is deliberately not picked up
          # here since the cli-macos-intel job already publishes its own.
          mkdir -p dist
          cp artifacts/bin/pirate-qt-*.dmg dist/
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qt-macos-intel
          path: dist/*

  release:
    name: Sign and Release
    # Real releases: pushing a vX.Y.Z tag. Auto-releases: every push to
    # master, versioned from configure.ac plus a git-sha suffix (see "Set
    # version suffix" steps above) so they don't collide with each other.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs:
      - linux-x86_64
      - windows-x86_64-cross
      - linux-aarch64-cross
      - cli-macos
      - cli-macos-intel
      - qt-macos
      - qt-macos-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install signing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg zip
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: downloaded
      - name: Collect artifacts
        run: |
          mkdir -p release
          find downloaded -type f -print0 | xargs -0 -I{} mv {} release/
          ls -la release
      - name: Import GPG signing key
        env:
          PIRATE_GPG_PRIVATE_KEY: ${{ secrets.PIRATE_GPG_PRIVATE_KEY }}
          PIRATE_GPG_PASSPHRASE: ${{ secrets.PIRATE_GPG_PASSPHRASE }}
        run: |
          if [ -z "$PIRATE_GPG_PRIVATE_KEY" ]; then
            echo "Missing PIRATE_GPG_PRIVATE_KEY secret."
            exit 1
          fi
          if [ -z "$PIRATE_GPG_PASSPHRASE" ]; then
            echo "Missing PIRATE_GPG_PASSPHRASE secret."
            exit 1
          fi
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          printf '%s' "$PIRATE_GPG_PRIVATE_KEY" \
            | tr -d '\r' \
            | sed 's/-----BEGIN PGP PRIVATE KEY BLOCK-----/-----BEGIN PGP PRIVATE KEY BLOCK-----\n/; s/-----END PGP PRIVATE KEY BLOCK-----/\n-----END PGP PRIVATE KEY BLOCK-----/' \
            | sed -n '/-----BEGIN PGP PRIVATE KEY BLOCK-----/,/-----END PGP PRIVATE KEY BLOCK-----/p' \
            | gpg --batch --pinentry-mode loopback --passphrase "$PIRATE_GPG_PASSPHRASE" --import
      - name: Sign artifacts
        env:
          PIRATE_GPG_PASSPHRASE: ${{ secrets.PIRATE_GPG_PASSPHRASE }}
        run: |
          VERSION="${{ needs.linux-x86_64.outputs.version }}"
          ./zcutil/signbinaries.sh --version "$VERSION"
      - name: Generate release notes
        run: |
          VERSION="${{ needs.linux-x86_64.outputs.version }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NOTES_RAW="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")"
          else
            NOTES_RAW="$(git log -1 --format='%B')"
          fi
          if [ -z "$NOTES_RAW" ]; then
            NOTES_FORMATTED="- (no release notes provided)"
          else
            NOTES_FORMATTED="$(printf '%s\n' "$NOTES_RAW" | awk '
              { gsub(/^[ \t]+|[ \t]+$/, "", $0); }
              $0 == "" { next }
              /^[*-][ \t]+/ { sub(/^[*-][ \t]+/, "- ", $0); print; next }
              { print "- " $0 }
            ')"
          fi
          sha256sum release/pirate-* | sed "s|release/||" | sort -k2,2 > release_hashes.txt
          {
            echo "Pirate ${VERSION}"
            echo
            echo "Updates"
            echo "$NOTES_FORMATTED"
            echo
            cat release_hashes.txt
          } > release_body.md
          echo "RELEASE_TITLE=Version ${VERSION} Signed Release" >> "$GITHUB_ENV"
          cat release_body.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_TITLE }}
          tag_name: v${{ needs.linux-x86_64.outputs.version }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body_path: release_body.md
          files: |
            release/pirate-*
            release/signatures-*.zip
          fail_on_unmatched_files: true
