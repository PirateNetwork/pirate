            build-essential \
            pkg-config \
            cmake \
            m4 \
            autoconf \
            libtool \
            unzip \
            git \
            python3 \
            python3-zmq \
            zlib1g-dev \
            wget \
            libcurl4-gnutls-dev \
            bsdmainutils \
            curl \
            libsodium-dev \
            bison \
            liblz4-dev \
            zip \
            gcc-mingw-w64-x86-64-posix \
            g++-mingw-w64-x86-64-posix \
            binutils-mingw-w64-x86-64
      - name: Build daemon (cross)
        run: |
          chmod +x zcutil/build-win.sh
          ./zcutil/build-win.sh -j$(nproc)
      - name: Determine package version
        shell: bash
        run: |
          BASE_VERSION="$(sed -n 's/^PACKAGE_VERSION *= *//p' Makefile | head -1)"
          if [ -n "${APP_VERSION_SUFFIX:-}" ]; then
