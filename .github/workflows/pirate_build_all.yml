          else
            VERSION="$BASE_VERSION"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Same HOST detection build-mac.sh uses, so this matches whatever
          # arch tag build-zip.sh gives the QT package built on this runner.
          HOST="$(./depends/config.guess)"
          echo "PLATFORM=${HOST%%-*}-macos" >> "$GITHUB_ENV"
      - name: Strip CLI (macOS)
        run: |
          strip -x src/pirated src/pirate-cli src/pirate-tx
      - name: Package CLI (macOS)
        run: |
          mkdir -p dist
          zip -j "dist/pirate-cli-${PLATFORM}-v${VERSION}.zip" \
            src/pirated \
            src/pirate-cli \
            src/pirate-tx \
            PIRATE_7776
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cli-macos-intel
          path: dist/*

  qt-macos:
    name: QT (macOS arm64)
    # Earliest arm64 image GitHub still offers (macos-13 and older are
    # retired) - same reasoning as pinning the Linux jobs to ubuntu:20.04:
    # macos-latest is a rolling target that eventually moves to a newer
    # macOS release without warning.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - name: Ensure parent depends alias
        shell: bash
        run: ln -sfn "$PWD/depends" "$PWD/../depends"
      - name: Set version suffix
        shell: bash
        run: |
          # Real releases (tag pushes) use configure.ac's version as-is.
          # Everything else (e.g. auto-release on master) appends a short
          # git sha so repeated builds off the same configure.ac version
          # don't collide - honored by build-qt-mac.sh/build-zip.sh.
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "APP_VERSION_SUFFIX=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: Install Homebrew dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew untap aws/tap 2>/dev/null || true

          install_brew_formulae() {
            missing=()
            for formula in "$@"; do
              if ! brew list --formula "$formula" >/dev/null 2>&1; then
                missing+=("$formula")
              fi
            done
            if [ "${#missing[@]}" -gt 0 ]; then
              brew install "${missing[@]}"
            fi
          }

          install_brew_formulae autoconf automake libtool coreutils bison cmake qt@5 create-dmg
          command -v pkg-config >/dev/null 2>&1 || brew install pkgconf
          command -v python3 >/dev/null 2>&1 || brew install python
          command -v wget >/dev/null 2>&1 || brew install wget
          command -v curl >/dev/null 2>&1 || brew install curl
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build QT (macOS)
        run: |
          chmod +x zcutil/build-qt-mac.sh
          ./zcutil/build-qt-mac.sh -j$(sysctl -n hw.ncpu)
      - name: Package QT (macOS)
        run: |
          # build-qt-mac.sh (via makeReleaseMac.sh) already versions (from
          # configure.ac, via the Makefile's PACKAGE_VERSION) and moves the
          # .dmg into artifacts/bin/pirate-qt-*.dmg. It also produces
          # artifacts/bin/pirate-cli-*.zip as a side effect (build-zip.sh's
          # "cli" package - macOS has no separate CLI-only build script this
          # job could call instead), which is deliberately not picked up
          # here since the cli-macos job already publishes its own.
          mkdir -p dist
          cp artifacts/bin/pirate-qt-*.dmg dist/
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qt-macos
          path: dist/*

  qt-macos-intel:
    name: QT (macOS Intel x86_64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - name: Ensure parent depends alias
        shell: bash
        run: ln -sfn "$PWD/depends" "$PWD/../depends"
      - name: Set version suffix
        shell: bash
        run: |
          # Real releases (tag pushes) use configure.ac's version as-is.
          # Everything else (e.g. auto-release on master) appends a short
          # git sha so repeated builds off the same configure.ac version
          # don't collide - honored by build-qt-mac.sh/build-zip.sh.
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
